<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASRAT — Admin Panel</title>
<style>
:root{--bg:#070707;--card:#101012;--line:#242428;--text:#f5f5f5;--muted:#92929b;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1b1b1d 0,transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.wrap{width:min(1050px,92vw);margin:0 auto;padding:28px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-size:22px;font-weight:800}.muted{color:var(--muted);font-size:13px}
button,input{font:inherit}.btn{border:1px solid var(--line);background:#18181b;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.btn:hover{background:#222225}.primary{background:#fff;color:#000;border-color:#fff}.danger{color:#ff7676}
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:rgba(16,16,18,.9);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 20px 60px #0008}.card h2{font-size:16px;margin:0 0 16px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input{width:100%;background:#0a0a0c;border:1px solid var(--line);border-radius:10px;padding:11px;color:#fff;outline:0}.field input:focus{border-color:#777}.full{width:100%}.notice{margin:0 0 16px;padding:10px 12px;border-radius:10px;background:#141416;color:#bbb;font-size:13px;display:none}.notice.show{display:block}.user{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.user:last-child{border-bottom:0}.user-main{min-width:0}.email{font-weight:650;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{font-size:10px;padding:4px 7px;border:1px solid var(--line);border-radius:999px;color:#bbb}.off{opacity:.45}.empty{color:var(--muted);text-align:center;padding:35px 10px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding-top:18px}.top{align-items:flex-start}.user{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="brand">ASRAT Admin</div><div class="muted">Kelola akun yang boleh masuk ke AI.</div></div>
    <button class="btn" id="logout">Keluar</button>
  </div>
  <div id="notice" class="notice"></div>
  <div class="grid">
    <section class="card">
      <h2>Tambah akun</h2>
      <form id="create">
        <div class="field"><label>Nama</label><input id="name" maxlength="80" placeholder="Nama user"></div>
        <div class="field"><label>Email</label><input id="email" type="email" required placeholder="user@email.com"></div>
        <div class="field"><label>Password</label><input id="pass" type="password" minlength="8" required placeholder="Minimal 8 karakter"></div>
        <button class="btn primary full">Buat akun</button>
      </form>
    </section>
    <section class="card">
      <h2>Daftar akun</h2>
      <div id="users"><div class="empty">Memuat...</div></div>
    </section>
  </div>
</div>
<script>
const API=(localStorage.getItem('ASRAT_API_URL')||'').replace(/\/$/,'');
const token=sessionStorage.getItem('ASRAT_TOKEN');
const notice=document.getElementById('notice');
function msg(t){notice.textContent=t;notice.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>notice.classList.remove('show'),3500)}
function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+sessionStorage.getItem('ASRAT_TOKEN')}}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request gagal');return d}
async function load(){try{const d=await api('/admin/users');document.getElementById('users').innerHTML=d.users.map(u=>`
<div class="user ${u.active?'':'off'}"><div class="user-main"><div class="email">${esc(u.email)}</div><div class="meta">${esc(u.name)} · <span class="pill">${esc(u.role)}</span> ${u.active?'':'· NONAKTIF'}</div></div>
<div class="actions"><button class="btn" onclick="toggleUser('${u.id}',${u.active})">${u.active?'Nonaktifkan':'Aktifkan'}</button>${u.role!=='admin'?`<button class="btn danger" onclick="delUser('${u.id}')">Hapus</button>`:''}</div></div>`).join('')||'<div class="empty">Belum ada akun.</div>'}catch(e){msg(e.message);if(/unauthorized|admin/i.test(e.message))location.href='index.html'}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function toggleUser(id,active){try{await api('/admin/users/'+id,{method:'PATCH',body:JSON.stringify({active:!active})});load()}catch(e){msg(e.message)}}
async function delUser(id){if(!confirm('Hapus akun ini?'))return;try{await api('/admin/users/'+id,{method:'DELETE'});load()}catch(e){msg(e.message)}}
document.getElementById('create').onsubmit=async e=>{e.preventDefault();try{await api('/admin/users',{method:'POST',body:JSON.stringify({name:name.value,email:email.value,password:pass.value})});e.target.reset();msg('Akun berhasil dibuat.');load()}catch(x){msg(x.message)}}
document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('ASRAT_TOKEN');location.href='index.html'}
if(!token||!API){location.href='index.html'}else load();
</script>
</body></html>
